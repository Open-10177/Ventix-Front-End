<div class="page">
  <div class="deco deco-tl"></div>
  <div class="deco deco-br"></div>

  <mat-card class="auth-card">
    <mat-card-content>

      <button type="button" mat-icon-button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div class="icon-row">
        <mat-icon class="lock-icon">lock_reset</mat-icon>
      </div>

      <h2 class="auth-title">{{ 'auth.recoverTitle' | translate }}</h2>
      <p class="auth-sub">{{ 'auth.recoverSub' | translate }}</p>

      @if (!sent()) {
        <mat-form-field appearance="outline" class="field">
          <mat-label>{{ 'auth.email' | translate }}</mat-label>
          <input matInput type="email" [(ngModel)]="email" />
          <mat-icon matSuffix>mail_outline</mat-icon>
        </mat-form-field>

        <button type="button" mat-flat-button class="send-btn"
          [disabled]="loading() || !email" (click)="send()">
          @if (loading()) { <mat-icon>hourglass_empty</mat-icon> }
          {{ 'auth.sendLink' | translate }}
        </button>
      } @else {
        <div class="success-box">
          <mat-icon class="success-icon">check_circle</mat-icon>
          <p>{{ 'auth.emailSent' | translate }}</p>
        </div>
        <button type="button" mat-stroked-button class="back-link" routerLink="/iam/sign-in">
          {{ 'auth.backToLogin' | translate }}
        </button>
      }

    </mat-card-content>
  </mat-card>
</div>
